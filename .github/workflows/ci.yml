name: CI

# Why this file exists (#253)
# --------------------------
# Until now the only gate between a change and production was `make test`
# (php -l / sh -n) run by hand on the machine doing the release. That gate cannot
# see a behavioural regression: the 2026-10-19 incident shipped a TypeError that
# 500'd every cache miss while `make test` stayed green, because syntax was fine.
#
# `unit` runs the behavioural suite (test/run_all.php) on every push and PR, on
# the PHP versions the project claims to support. `make test-unit` is already a
# prerequisite of `make release`, so this job mostly protects the window between
# a commit and the next release — and it runs on a clean machine, which is the
# only place "it works on my box" gets checked.
#
# fetch-depth: 0 is not a default worth omitting: the release-version tests
# (#250) read real tags and history, and a shallow clone makes them pass for the
# wrong reason or fail outright.
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Daily staging smoke. Off the :00 mark so it does not pile onto GitHub's
    # busiest scheduling minute.
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: unit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          # mbstring is a hard install dependency (install.sh's
          # check_mbstring()); normalizeParameter() calls mb_check_encoding()
          # on every request. Ask for it explicitly rather than relying on each
          # PHP image's default extension set, which differs between versions.
          extensions: mbstring, sqlite3
      # The Makefile refuses to run without .deploy.mk (it holds server settings
      # and is gitignored). `test` / `test-unit` never read those values, so the
      # example's placeholders are enough — this keeps the CI and the release
      # running the same `make` targets instead of a hand-copied duplicate.
      - name: provide a placeholder .deploy.mk
        run: cp .deploy.mk.example .deploy.mk
      - name: php sanity
        # Cheap canary: mb_check_encoding() runs on every request, and a broken
        # or partial mbstring makes normalizeParameter() return "" for every
        # name — the page still renders, it just stops finding anything. Print
        # the facts that decide it, so a failing suite points here first.
        run: |
          php -r 'printf("PHP %s, mbstring=%s, check_encoding(ls)=%s, default_charset=%s, PCRE=%s\n",
              PHP_VERSION, extension_loaded("mbstring") ? "yes" : "NO",
              var_export(mb_check_encoding("ls", "UTF-8"), true), ini_get("default_charset"),
              PCRE_VERSION);'
          php -r 'require "src/util.php";
              var_dump(normalizeParameter("ls"));
              var_dump(preg_replace("/[\x00-\x1F\x7F]+/", " ", "ls"));
              var_dump(preg_last_error_msg());'
      - name: syntax gate
        run: make test
      - name: behavioural suite
        run: php test/run_all.php

  # Golden-corpus gate (#255, test/corpus/check.php). Separate from `unit` and
  # pinned to PHP 8.3 only — the corpus is frozen against the production web
  # SAPI version, so running it on the 8.1/8.2 matrix legs would compare
  # renders from versions the goldens were never captured on. xmllint
  # (libxml2-utils) must be present or the xhtml check SKIPs and the gate runs
  # hollow; ubuntu-latest does not ship it by default.
  corpus:
    name: corpus (PHP 8.3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: mbstring, sqlite3
      - run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      # Same placeholder-copy as `unit`: the Makefile $(error)s without
      # .deploy.mk at parse time, and test-corpus never reads its values.
      - run: cp .deploy.mk.example .deploy.mk
      - run: make test-corpus

  shellcheck:
    name: shellcheck (advisory)
    runs-on: ubuntu-latest
    # Advisory on purpose: the shell scripts predate shellcheck and a red X here
    # would block merges over style, not correctness. Fix them, then flip this.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck cli/*.sh deploy/*.sh install.sh

  staging-smoke:
    name: staging smoke (daily, advisory)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Advisory: this hits a live host, and a DreamHost hiccup is not a reason to
    # mark the repository red for a day.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: mbstring, sqlite3
      - name: regression against staging
        env:
          PHP_MAN_URL: https://test.chedong.com/phpMan.php
        run: bash test/phpman-regression.sh
